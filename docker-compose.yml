services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - default
      - database
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  migrations:
    image: ${MIGRATIONS_IMAGE:?MIGRATIONS_IMAGE must be set}
    env_file:
      - .env.production
    networks:
      - database

networks:
  database:
    external: true
    name: everlong-database
