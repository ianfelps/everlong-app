name: Deploy production

on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'development' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DATABASE_URL: postgres://postgres:password@db.example.com:5432/postgres
      GOOGLE_DRIVE_FOLDER_ID: deploy-folder
      TMDB_API_TOKEN: deploy-token
      SESSION_SECRET: 0123456789abcdef0123456789abcdef
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and publish migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          target: migrations
          tags: ghcr.io/${{ github.repository }}-migrations:${{ github.sha }}

      - name: Upload Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.yml
          target: /opt/everlong

      - name: Pull and restart application
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          MIGRATIONS_IMAGE: ghcr.io/${{ github.repository }}-migrations:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: APP_IMAGE,GHCR_TOKEN,GHCR_USERNAME,MIGRATIONS_IMAGE
          script: |
            set -eu
            cd /opt/everlong
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            APP_IMAGE="$APP_IMAGE" MIGRATIONS_IMAGE="$MIGRATIONS_IMAGE" docker compose --env-file .env.production pull
            docker logout ghcr.io
            MIGRATIONS_IMAGE="$MIGRATIONS_IMAGE" docker compose --env-file .env.production run --rm --interactive=false migrations
            APP_IMAGE="$APP_IMAGE" MIGRATIONS_IMAGE="$MIGRATIONS_IMAGE" docker compose --env-file .env.production up -d --remove-orphans --wait --wait-timeout 90 app
            printf 'APP_IMAGE=%s\nMIGRATIONS_IMAGE=%s\n' "$APP_IMAGE" "$MIGRATIONS_IMAGE" > .deployment.env
            chmod 600 .deployment.env
            docker image prune --force
